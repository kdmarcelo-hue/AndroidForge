name: V12 Automatic Build

on:
  push:
    branches:
      - main
    paths:
      - 'input/*.zip'
      - 'input/**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-sources:
    name: Detect uploaded source ZIPs
    runs-on: ubuntu-latest
    outputs:
      zip_matrix: ${{ steps.detect.outputs.zip_matrix }}
      has_zips: ${{ steps.detect.outputs.has_zips }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect uploaded source ZIPs
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mapfile -t FILES < <(find input -type f -iname '*.zip' -print 2>/dev/null | sort)
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$AFTER" -- 'input/*.zip' 'input/**/*.zip' | while IFS= read -r file; do [[ -f "$file" ]] && printf '%s\n' "$file"; done)
            else
              mapfile -t FILES < <(git diff --name-only "$BEFORE" "$AFTER" -- 'input/*.zip' 'input/**/*.zip' | while IFS= read -r file; do [[ -f "$file" ]] && printf '%s\n' "$file"; done)
            fi
          fi
          if (( ${#FILES[@]} == 0 )); then
            echo "Nenhum ZIP novo ou modificado foi encontrado em input/."
            echo "has_zips=false" >> "$GITHUB_OUTPUT"
            echo "zip_matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATRIX="$(printf '%s\n' "${FILES[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "ZIPs detectados: $MATRIX"
          echo "zip_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_zips=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.zip_path }}
    needs: detect-sources
    if: needs.detect-sources.outputs.has_zips == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        zip_path: ${{ fromJson(needs.detect-sources.outputs.zip_matrix) }}
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ZIP and name artifact
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ matrix.zip_path }}"
          test -f "$ZIP"
          unzip -t "$ZIP"
          BASE="$(basename "$ZIP" .zip)"
          SAFE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '-')"
          echo "artifact_name=V12-${SAFE}-debug" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager não foi encontrado em $ANDROID_HOME/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o "$RUNNER_TEMP/gradle-8.7-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract and locate Android project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/v12-source"
          mkdir -p "$DEST"
          unzip -q "${{ matrix.zip_path }}" -d "$DEST"
          SETTINGS_FILE="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERRO: não foi encontrado settings.gradle ou settings.gradle.kts no ZIP."
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_ROOT/app/build.gradle" && ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]]; then
            echo "ERRO: projeto Gradle localizado, mas o módulo Android app/ não foi encontrado."
            exit 1
          fi
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto localizado em: $PROJECT_ROOT"

      - name: Build Debug APK
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify and stage APK
        id: apk
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print | sort | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "ERRO: a compilação terminou sem gerar APK."
            exit 1
          fi
          OUT="$RUNNER_TEMP/v12-artifact"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/"
          echo "artifact_dir=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.artifact_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30
