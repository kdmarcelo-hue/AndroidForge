name: V12 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "input/**.zip"

permissions:
  contents: read

concurrency:
  group: v12-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"

jobs:
  build-v12:
    name: Build V12 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Locate V12 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find input -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$ZIP"
          echo "Using: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V12 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v12-src"
          mkdir -p "$RUNNER_TEMP/v12-src"
          unzip -q "${{ steps.source.outputs.zip }}" -d "$RUNNER_TEMP/v12-src"

          ROOT="$RUNNER_TEMP/v12-src"
          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            FOUND="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            test -n "$FOUND"
            ROOT="$(dirname "$FOUND")"
          fi

          echo "Project root: $ROOT"
          test -f "$ROOT/app/build.gradle"
          echo "project_root=$ROOT" >> "$GITHUB_ENV"

      - name: Validate V12 identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$project_root/app/build.gradle"

          grep -q "applicationId 'v12.marcelo.virtuselm'" "$BUILD_FILE"

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$BUILD_FILE" | head -1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" "$BUILD_FILE" | head -1)"

          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 0
          test -n "$VERSION_NAME"
          grep -q "gradle-8.7-bin.zip" "$project_root/gradle/wrapper/gradle-wrapper.properties"

          echo "V12 versionCode: $VERSION_CODE"
          echo "V12 versionName: $VERSION_NAME"
          echo "V12_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "V12_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "V12 identity validated."

      - name: Prepare permanent V12 keystore
        shell: bash
        env:
          V12_KEYSTORE_BASE64: ${{ secrets.V12_KEYSTORE_BASE64 }}
          V12_KEYSTORE_PASSWORD: ${{ secrets.V12_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$V12_KEYSTORE_BASE64"
          test -n "$V12_KEYSTORE_PASSWORD"

          CLEAN_BASE64="$(printf '%s' "$V12_KEYSTORE_BASE64" | tr -d '[:space:]')"
          CLEAN_BASE64="${CLEAN_BASE64#data:application/octet-stream;base64,}"
          test -n "$CLEAN_BASE64"

          printf '%s' "$CLEAN_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/v12-release.keystore"
          chmod 600 "$RUNNER_TEMP/v12-release.keystore"
          test -s "$RUNNER_TEMP/v12-release.keystore"

          keytool -list -keystore "$RUNNER_TEMP/v12-release.keystore" -storepass "$V12_KEYSTORE_PASSWORD" >/dev/null
          echo "V12 keystore prepared and validated."

      - name: Build signed V12 Release
        shell: bash
        env:
          V12_KEYSTORE_PATH: ${{ runner.temp }}/v12-release.keystore
          V12_KEYSTORE_PASSWORD: ${{ secrets.V12_KEYSTORE_PASSWORD }}
          V12_KEY_ALIAS: ${{ secrets.V12_KEY_ALIAS }}
          V12_KEY_PASSWORD: ${{ secrets.V12_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$project_root"
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$project_root/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK: $APK"

          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"

          BADGING="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='v12.marcelo.virtuselm'"
          echo "$BADGING" | grep -q "versionCode='$V12_VERSION_CODE'"
          echo "$BADGING" | grep -q "versionName='$V12_VERSION_NAME'"

          cp "$APK" "$GITHUB_WORKSPACE/VirtusELM-V12-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtusELM-V12-Release
          path: VirtusELM-V12-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/v12-release.keystore"
