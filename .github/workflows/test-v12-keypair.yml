name: Test V12 Keypair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keypair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate V12 alias and key password
        shell: bash
        env:
          V12_KEYSTORE_BASE64: ${{ secrets.V12_KEYSTORE_BASE64 }}
          V12_KEYSTORE_PASSWORD: ${{ secrets.V12_KEYSTORE_PASSWORD }}
          V12_KEY_ALIAS: ${{ secrets.V12_KEY_ALIAS }}
          V12_KEY_PASSWORD: ${{ secrets.V12_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$V12_KEYSTORE_BASE64"
          test -n "$V12_KEYSTORE_PASSWORD"
          test -n "$V12_KEY_ALIAS"
          test -n "$V12_KEY_PASSWORD"

          CLEAN_BASE64="$(printf '%s' "$V12_KEYSTORE_BASE64" | tr -d '[:space:]')"
          CLEAN_BASE64="${CLEAN_BASE64#data:application/octet-stream;base64,}"

          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/v12-release.keystore"
          chmod 600 "$RUNNER_TEMP/v12-release.keystore"

          keytool -list \
            -keystore "$RUNNER_TEMP/v12-release.keystore" \
            -storepass "$V12_KEYSTORE_PASSWORD" \
            -alias "$V12_KEY_ALIAS" \
            >/dev/null

          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/v12-release.keystore" \
            -srcstoretype PKCS12 \
            -srcstorepass "$V12_KEYSTORE_PASSWORD" \
            -srcalias "$V12_KEY_ALIAS" \
            -srckeypass "$V12_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/keypair-test.keystore" \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password-123" \
            -noprompt \
            >/dev/null

          echo "RESULTADO: KEYSTORE + SENHA + ALIAS + SENHA DA CHAVE = VALIDOS."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/v12-release.keystore" \
            "$RUNNER_TEMP/keypair-test.keystore"
