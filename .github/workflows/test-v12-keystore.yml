name: Test V12 Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate V12 keystore secret
        shell: bash
        env:
          V12_KEYSTORE_BASE64: ${{ secrets.V12_KEYSTORE_BASE64 }}
          V12_KEYSTORE_PASSWORD: ${{ secrets.V12_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$V12_KEYSTORE_BASE64" || {
            echo "RESULTADO: V12_KEYSTORE_BASE64 está vazio ou não existe."
            exit 1
          }

          test -n "$V12_KEYSTORE_PASSWORD" || {
            echo "RESULTADO: V12_KEYSTORE_PASSWORD está vazio ou não existe."
            exit 1
          }

          CLEAN_BASE64="$(printf '%s' "$V12_KEYSTORE_BASE64" | tr -d '[:space:]')"
          CLEAN_BASE64="${CLEAN_BASE64#data:application/octet-stream;base64,}"

          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/v12-release.keystore"
          chmod 600 "$RUNNER_TEMP/v12-release.keystore"

          test -s "$RUNNER_TEMP/v12-release.keystore"

          keytool -list \
            -keystore "$RUNNER_TEMP/v12-release.keystore" \
            -storepass "$V12_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "RESULTADO: KEYSTORE + BASE64 + SENHA = VALIDOS."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/v12-release.keystore"
